spring.application.name=auth-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:6000/auth-service
spring.datasource.username=alexa
spring.datasource.password=auth-service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=localhost:9092
jwt.secret=your-secret-key-for-jwt-tokens-256-bit-min-must-be-long
jwt.expiration=86400000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=10000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
resend.api.key=${RESEND_API_KEY}
resend.from.email=onboarding@resend.dev