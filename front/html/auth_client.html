<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LinkUp</title>
  <link rel="stylesheet" href="../css/auth_client.css">
</head>
<body>
<div class="split">
  <div class="left">
    <h1 id="back-h1">LinkUp</h1>
    <h2 id="back-h2">Find your tribe</h2>
  </div>
  <div class="right">
    <div class="auth-form">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue</p>
      <form>
        <label for="login">Login</label>
        <input type="text" id="login" placeholder="john@example.com">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button type="submit" class="btn">Sign In</button>
      </form>
      <div class="register-link">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
