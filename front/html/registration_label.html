<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LinkUp</title>
  <link rel="stylesheet" href="../css/auth_client.css">
</head>
<body>
<div class="split">
  <div class="left">
    <h1 id="back-h1">LinkUp</h1>
    <h2 id="back-h2">Find your tribe</h2>
  </div>
  <div class="right">
    <div class="auth-form">
      <h2>Register</h2>
      <p class="subtitle">Sign in to continue</p>
      <form>
        <label for="login">Login</label>
        <input type="text" id="login" placeholder="john*-*john">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <label for="password">Repeat password</label>
        <input type="password" id="repeat password" placeholder="••••••••">
        <button type="submit" class="btn" onclick="goToRegistrationCode()">Register</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
